<!DOCTYPE html>
<html id="page-footer" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" media="all" href="style.css">
</head>
<!-- Running foot. Printed and exported pages only; turn on
     Settings > Templates > Printing & PDF Export > Footers.
     Drawn inside IATemplateFooterHeight (Info.plist).

     The draft date on every page, so a marked copy that comes back
     can be matched to its version at a glance. A reviewer once marked
     a printout that turned out to be a different version from the text
     of record, and it took a hand comparison of the headings to find
     out. The title is already in the running head. -->
<body>
    <div class="footer-container">Draft of <span data-date>&nbsp;</span></div>
</body>
</html>
